<!doctype html>
<!-- 個案索引。其他組員加入自己的個案時，照下面的 <a class="card"> 複製一份即可。 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EASTD 143A · 數位人文個案</title>
<style>
:root{color-scheme:light;--bg:#f7f6f3;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--mut:#86857f;--rule:#e0dfda;--accent:#1c5cab}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])){color-scheme:dark;
  --bg:#121211;--card:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--mut:#8e8d85;--rule:#333331;--accent:#86b6ef}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.75;
 font-family:"Source Han Serif SC","Noto Serif CJK SC","Songti SC",Georgia,serif}
.wrap{max-width:720px;margin:0 auto;padding:64px 16px 80px}
.kicker{font-size:12.5px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;
 font-family:ui-sans-serif,system-ui,sans-serif;margin:0 0 12px}
h1{font-size:clamp(26px,5vw,36px);margin:0 0 12px;letter-spacing:-.01em}
.sub{color:var(--ink2);margin:0 0 36px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);
 border:1px solid var(--rule);border-radius:11px;padding:20px 22px;margin:0 0 14px}
a.card:hover{border-color:var(--accent)}
a.card h2{margin:0 0 6px;font-size:19px;color:var(--accent)}
a.card p{margin:0;color:var(--ink2);font-size:14.5px}
a.card .meta{margin-top:10px;font-size:12.5px;color:var(--mut);
 font-family:ui-sans-serif,system-ui,sans-serif}
footer{margin-top:40px;color:var(--mut);font-size:13px}
</style>
</head>
<body><div class="wrap">
<p class="kicker">EASTD 143A</p>
<h1>東亞人文的數位工具與方法</h1>
<p class="sub">課程個案研究。每個個案從一批真實史料出發，經採集、結構化與考訂，產出可複用的數據集與分析。</p>

<a class="card" href="minzhong-land-deeds/">
  <h2>閩中契約</h2>
  <p>匹茲堡大學藏中國土地文書 235 件（1584–1978）。歷史政區歸併、宗族網絡、時空分布與官民契比例變化。</p>
  <p class="meta">235 件 · 304 位當事人 · 32 組字輩 · 數據以 CC0 釋出</p>
</a>

<footer>各個案的數據來源與權利狀態見其頁內說明。</footer>
</div></body></html>
